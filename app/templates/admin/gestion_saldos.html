{% extends 'base.html' %}
{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h2 class="fw-bold"><i class="bi bi-pencil-square text-pink"></i> Gestión de <span class="text-pink">Saldos Manuales</span></h2>
        <p class="text-muted">Cargue saldos iniciales, trabajos realizados o ajustes de cuenta corriente.</p>
    </div>
</div>

<div class="row">
    <div class="col-md-7 mx-auto">
        <div class="card shadow-lg border-0 overflow-hidden">
            <div class="card-header bg-dark text-white p-3">
                <h5 class="mb-0 fw-bold small text-uppercase">Registrar Ajuste / Trabajo</h5>
            </div>
            <div class="card-body p-4 bg-white text-dark">
                <form method="POST">
                    <div class="row g-3">
                        <!-- TIPO DE CUENTA -->
                        <div class="col-md-6">
                            <label class="fw-bold small text-muted">TIPO DE CUENTA</label>
                            <select name="tipo_entidad" id="tipo_entidad" class="form-select border-dark" onchange="switchEntidad(this.value)">
                                <option value="CLIENTE">CLIENTE (Cuenta Corriente)</option>
                                <option value="PROVEEDOR">PROVEEDOR (Cuenta a Pagar)</option>
                            </select>
                        </div>

                        <!-- SUCURSAL -->
                        <div class="col-md-6">
                            <label class="fw-bold small text-muted">SUCURSAL DONDE IMPACTA</label>
                            <select name="sucursal_id" class="form-select border-dark" required>
                                {% for s in sucursales %}<option value="{{ s.id }}">{{ s.nombre }}</option>{% endfor %}
                            </select>
                        </div>

                        <!-- SELECTOR CONTACTO -->
                        <div class="col-12">
                            <div class="d-flex justify-content-between align-items-end mb-1">
                                <label class="fw-bold small text-muted">SELECCIONAR PERSONA / EMPRESA</label>
                                <button type="button" class="btn btn-sm p-0 text-pink fw-bold text-decoration-none" data-bs-toggle="modal" data-bs-target="#modalAltaRapida">
                                    + CREAR CONTACTO NUEVO
                                </button>
                            </div>
                            
                            <div id="box_clientes">
                                <select name="entidad_id" class="form-select border-dark select2">
                                    <option value="">-- Buscar Cliente --</option>
                                    {% for c in clientes %}<option value="{{ c.id }}">{{ c.razon_social }} ({{ c.cuit }})</option>{% endfor %}
                                </select>
                            </div>
                            <div id="box_proveedores" class="d-none">
                                <select name="entidad_id" id="sel_prov" class="form-select border-dark select2" disabled>
                                    <option value="">-- Buscar Proveedor --</option>
                                    {% for p in proveedores %}<option value="{{ p.id }}">{{ p.razon_social }} ({{ p.cuit }})</option>{% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- MOTIVO -->
                        <div class="col-md-6">
                            <label class="fw-bold small text-muted">TIPO DE OPERACIÓN</label>
                            <select name="motivo" class="form-select border-dark">
                                <option value="SALDO INICIAL">SALDO INICIAL (MIGRACIÓN)</option>
                                <option value="TRABAJO REALIZADO">TRABAJO REALIZADO (MANO DE OBRA)</option>
                                <option value="AJUSTE DE CUENTA">AJUSTE / BONIFICACIÓN</option>
                            </select>
                        </div>

                        <!-- MONTO -->
                        <div class="col-md-6">
                            <label class="fw-bold small text-muted">MONTO ($)</label>
                            <input type="number" step="0.01" name="monto" class="form-control border-primary fw-bold" placeholder="0.00" required>
                            <div class="x-small text-muted mt-1">
                                <i class="bi bi-info-circle"></i> (+) Suma Deuda | (-) Saldo a favor
                            </div>
                        </div>

                        <!-- OBSERVACIONES -->
                        <div class="col-12">
                            <label class="fw-bold small text-muted">DETALLE / OBSERVACIONES</label>
                            <textarea name="observaciones" rows="3" class="form-control border-dark" placeholder="Describa el trabajo realizado o el por qué del ajuste..." required></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2 mt-4 shadow">
                        <i class="bi bi-save-fill"></i> REGISTRAR MOVIMIENTO EN VACAN
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- MODAL ALTA RÁPIDA -->
<div class="modal fade" id="modalAltaRapida" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered text-dark">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-pink text-white">
                <h5 class="modal-title fw-bold">Alta Rápida de Contacto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="form_alta_rapida">
                    <div class="mb-3">
                        <label class="small fw-bold">Razón Social / Nombre Completo</label>
                        <input type="text" id="pop_nombre" class="form-control border-dark text-uppercase" required>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">CUIT / DNI</label>
                        <input type="text" id="pop_cuit" class="form-control border-dark" placeholder="Sin guiones" required>
                    </div>
                    <div class="mb-4">
                        <label class="small fw-bold">Categoría</label>
                        <select id="pop_tipo" class="form-select border-dark">
                            <option value="CLIENTE">CLIENTE</option>
                            <option value="PROVEEDOR">PROVEEDOR</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-dark w-100 fw-bold" onclick="ejecutarAlta()">GUARDAR Y RECARGAR</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function switchEntidad(val) {
    const bCli = document.getElementById('box_clientes');
    const bProv = document.getElementById('box_proveedores');
    const sProv = document.getElementById('sel_prov');
    const sCli = document.querySelector('#box_clientes select');

    if(val === 'CLIENTE') {
        bCli.classList.remove('d-none'); bProv.classList.add('d-none');
        sCli.disabled = false; sProv.disabled = true;
    } else {
        bCli.classList.add('d-none'); bProv.classList.remove('d-none');
        sCli.disabled = true; sProv.disabled = false;
    }
}

async function ejecutarAlta() {
    const nombre = document.getElementById('pop_nombre').value;
    const cuit = document.getElementById('pop_cuit').value;
    const tipo = document.getElementById('pop_tipo').value;

    if(!nombre || !cuit) return alert("Cargue los datos requeridos.");

    const url = tipo === 'CLIENTE' ? '/admin/cliente/nuevo' : '/admin/proveedor/nuevo';
    const form = new URLSearchParams();
    form.append('razon_social', nombre);
    form.append('cuit', cuit);
    form.append('activo', 'True');

    try {
        const res = await fetch(url, { method: 'POST', body: form });
        if(res.ok) {
            alert("Registrado con éxito. La página se actualizará.");
            location.reload();
        }
    } catch(e) { alert("Error de conexión."); }
}
</script>

<style>
    .select2-container--bootstrap-5 { font-size: 0.85rem; }
    .x-small { font-size: 0.7rem; }
</style>
{% endblock %}
