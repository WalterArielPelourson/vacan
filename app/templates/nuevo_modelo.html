{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="glass p-8 rounded-3xl border border-cyan-500/20 shadow-2xl">
        <h2 class="text-2xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-300 uppercase tracking-widest text-center">
            Registrar Vehículo Base
        </h2>
        
        <form action="{{ url_for('inventory.nuevo_modelo') }}" method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-mono text-cyan-400 mb-2">MARCA (EJ: TOYOTA/FORD)</label>
                    <input type="text" name="marca" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-cyan-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-mono text-cyan-400 mb-2">MODELO (EJ: HILUX/CARGO)</label>
                    <input type="text" name="modelo" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-cyan-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-mono text-cyan-400 mb-2">AÑO INICIO</label>
                    <input type="number" name="anio_inicio" placeholder="2015" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
                </div>
                <div>
                    <label class="block text-xs font-mono text-cyan-400 mb-2">AÑO FIN (Opcional)</label>
                    <input type="number" name="anio_fin" placeholder="2023" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-500 hover:from-cyan-500 hover:to-blue-400 text-white font-black py-4 rounded-xl uppercase tracking-widest">
                Guardar Vehículo en Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
